<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tu centro de mando KipZone: puntos, actividad y recompensas.">
  <title>KipZone Rewards | Centro de mando</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/rewards/style.css?v=20261001-5">
  <script src="/rewards/script.js?v=20261001-5" defer></script>
</head>
<body class="rewards-page command-page" data-page="dashboard" data-command-center>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <div class="brand-group">
      <a href="/" class="brand" aria-label="KipZone, inicio"><img src="/assets/kipzone-wordmark.svg" width="150" height="38" alt="KipZone"></a>
      <nav class="zone-switch" aria-label="Cambiar zona"><a href="/">Corredores</a><a href="/organizadores/">Organizadores</a><a href="/rewards/" aria-current="page">Rewards</a></nav>
    </div>
    <button class="menu-toggle" aria-label="Abrir menú" aria-controls="main-nav" aria-expanded="false" type="button"><span></span><span></span></button>
    <nav id="main-nav" class="site-nav" aria-label="Cuenta"><span class="demo-badge">DEMO</span><button class="button secondary small" data-login type="button">Entrar a KipZone <span aria-hidden="true">↗</span></button></nav>
  </header>
  <main id="main" class="command-shell container">
    <aside class="dashboard-sidebar">
      <p class="eyebrow">Rewards</p>
      <nav aria-label="Dashboard"><a href="#overview" aria-current="location"><span aria-hidden="true">◫</span> Overview</a><a href="#actividad"><span aria-hidden="true">↗</span> Actividad</a><a href="#recompensas"><span aria-hidden="true">⚑</span> Rewards</a><a href="#wallet"><span aria-hidden="true">▱</span> Wallet</a></nav>
      <div class="command-sidebar-foot"><img src="/rewards/assets/territory-city.webp" alt="" width="130" height="106"><a class="text-link" href="https://play.google.com/store/apps/details?id=com.revive.redsocial" target="_blank" rel="noopener noreferrer">Abrir KipZone ↗</a></div>
    </aside>
    <div class="command-content" data-dashboard>
      <div class="command-heading"><div><p class="eyebrow">KipZone Rewards</p><h1>Corre. Conquista. <em>Gana.</em></h1></div><span class="command-account"><span class="avatar" aria-hidden="true">G</span><span data-user-name></span></span></div>
      <div class="command-toolbar"><p class="demo-notice"><span class="demo-badge">DEMO</span> Datos de ejemplo</p><details class="demo-controls"><summary>Probar estados</summary><div><label>Puntos<select data-demo-state><option value="ready">Con puntos</option><option value="empty">Sin puntos</option><option value="loading">Cargando</option><option value="error">Error</option></select></label><label>Wallet<select data-wallet-state><option value="disconnected">No conectada</option><option value="connected">Conectada</option><option value="confirm">Confirmación</option><option value="success">Éxito simulado</option></select></label></div></details></div>
      <h2 class="command-view-title" data-view-title hidden></h2>
      <div data-dashboard-status role="status" aria-live="polite"></div>
      <div class="command-grid" data-dashboard-panels>
        <section id="overview" class="command-points" data-command-view="overview" aria-label="Tus puntos"><div data-points-panel></div></section>
        <section id="recompensas" class="command-reward" data-command-view="recompensas" aria-label="Recompensas"><div data-reward-panel></div></section>
        <section id="actividad" class="command-activity" data-command-view="actividad" aria-label="Actividad"><div data-activity-panel></div></section>
        <section id="wallet" class="command-wallet" data-command-view="wallet" aria-label="Wallet"><div data-wallet-panel></div></section>
      </div>
      <footer class="command-footer"><span>KipZone Rewards</span><nav aria-label="Legal"><a href="/privacy/">Privacidad</a><a href="/terms/">Términos</a></nav></footer>
    </div>
  </main>
  <noscript><p class="noscript-note">Activa JavaScript para explorar el centro de mando.</p></noscript>
  <div data-dialog-root></div>
</body>
</html>
