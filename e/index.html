<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inscripción al evento · KipZone</title>
<meta name="theme-color" content="#0A0E0C">
<style>
  :root{
    --bg:#0A0E0C;--surface:#151C18;--surface2:#1C2621;--line:#2A3730;
    --text:#F2F5F3;--soft:#9AA79F;--accent:#35D07F;--danger:#FF6B6B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;justify-content:center}
  button,input{font:inherit}
  .wrap{width:100%;max-width:480px;padding:18px 18px 48px}
  .brand{display:flex;align-items:center;gap:7px;font-weight:850;font-size:15px;
    margin:2px 0 20px}.brand span{color:var(--accent)}
  .pill{display:inline-block;background:var(--accent);color:#06120C;font-size:10px;
    font-weight:900;letter-spacing:1.5px;padding:6px 11px;border-radius:30px;margin-bottom:14px}
  .hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:18px;
    background:var(--surface);display:block;margin-bottom:18px}
  h1{font-size:30px;line-height:1.04;font-weight:900;letter-spacing:-.7px;
    margin-bottom:13px;word-wrap:break-word}
  h2{font-size:21px;line-height:1.15;margin-bottom:8px}
  .meta{display:flex;gap:10px;align-items:flex-start;color:var(--soft);
    font-size:14px;margin-bottom:9px;line-height:1.35}.meta b{color:var(--text);font-weight:650}
  .divider{height:1px;background:var(--line);margin:20px 0}
  .stats{display:flex;gap:24px;margin:18px 0}.stat .n{font-size:24px;font-weight:900;color:var(--accent)}
  .stat .l{font-size:10px;letter-spacing:1.2px;color:var(--soft);font-weight:750}
  .stat .detail{margin-top:4px;color:var(--soft);font-size:11px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    padding:20px;margin-top:18px}.card p{color:var(--soft);font-size:13px;line-height:1.5}
  .field{margin-top:16px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}
  .field input{width:100%;border:1px solid var(--line);background:var(--surface2);
    color:var(--text);border-radius:12px;padding:14px 13px;outline:none}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(53,208,127,.12)}
  .field small{display:block;color:var(--soft);font-size:11px;line-height:1.4;margin-top:6px}
  .consent{display:flex;align-items:flex-start;gap:10px;margin:17px 0 14px;
    color:var(--soft);font-size:12px;line-height:1.45}.consent input{margin-top:2px;accent-color:var(--accent)}
  a{color:var(--accent)}
  .cta{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;
    border:0;background:var(--accent);color:#06120C;text-align:center;padding:16px;
    border-radius:14px;font-weight:850;font-size:16px;text-decoration:none;cursor:pointer}
  .cta:disabled{opacity:.55;cursor:wait}.cta.ghost{background:transparent;color:var(--text);
    border:1.5px solid var(--line);font-weight:700;margin-top:10px}
  .hint{color:var(--soft);font-size:12px;text-align:center;line-height:1.5;margin-top:13px}
  .error{color:var(--danger);font-size:12px;line-height:1.4;margin:10px 0;min-height:17px}
  .sms-code{text-align:center;letter-spacing:8px;font-size:23px;font-weight:800}
  .sms-resend{border:0;background:none;color:var(--accent);padding:10px 0;font-size:12px;cursor:pointer}
  .state{padding:64px 8px;text-align:center;color:var(--soft);font-size:14px;line-height:1.5}
  .success{text-align:center}.check{width:58px;height:58px;border-radius:50%;background:var(--accent);
    color:#06120C;display:grid;place-items:center;font-size:30px;font-weight:900;margin:0 auto 15px}
  .success strong{display:block;font-size:23px;margin-bottom:8px}.success p{max-width:330px;margin:0 auto}
  .personal-qr{background:#fff;border-radius:18px;padding:18px;width:max-content;max-width:100%;
    margin:20px auto 10px}.personal-qr img,.personal-qr canvas{display:block;max-width:100%}
  .code{font-size:11px;letter-spacing:1.2px;color:var(--soft);text-align:center;margin-top:8px}
  .spinner{width:18px;height:18px;border:2px solid rgba(6,18,12,.35);
    border-top-color:#06120C;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:360px){h1{font-size:27px}.card{padding:17px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">▲ Kip<span>Zone</span></div>
  <div id="app"><div class="state">Cargando el evento…</div></div>
</main>
<script src="./qrcode.min.js"></script>
<script>
const PROJECT = 'red-social-1cn89d';
const API_KEY = 'AIzaSyCkjykS147iM4ncwxVm4uU4NGHlaXlUlqE';
const PLAY = 'https://play.google.com/store/apps/details?id=com.revive.redsocial';
const PRIVACY = 'https://kipzone.run/privacy/';
const DB = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
const AUTH_STORAGE = 'kz_web_registration_auth_v1';

const params = new URLSearchParams(location.search);
const eventId = (params.get('id') || '').trim();
const app = document.getElementById('app');
let eventData = null;
let phoneVerification = null;
let phoneSdkPromise = null;
let phoneRecaptcha = null;

function val(f){
  if (!f) return null;
  if ('stringValue' in f) return f.stringValue;
  if ('integerValue' in f) return parseInt(f.integerValue,10);
  if ('doubleValue' in f) return Number(f.doubleValue);
  if ('booleanValue' in f) return f.booleanValue;
  if ('timestampValue' in f) return new Date(f.timestampValue);
  return null;
}
function fecha(d){
  if (!(d instanceof Date)||isNaN(d)) return '';
  return d.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'})+
    ' · '+d.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function randomToken(){
  const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
  return btoa(String.fromCharCode.apply(null,bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function normalizePhone(v){
  let n=String(v||'').replace(/\D/g,'');
  if(n.startsWith('56')) n=n.slice(2);
  if(n.length===8) n='9'+n;
  return n.length===9?'+56'+n:'';
}
function normalizeRut(v){return String(v||'').replace(/[^0-9kK]/g,'').toUpperCase();}
function validRut(v){
  const r=normalizeRut(v);if(r.length<8||r.length>9)return false;
  const body=r.slice(0,-1),dv=r.slice(-1);let sum=0,m=2;
  for(let i=body.length-1;i>=0;i--){sum+=Number(body[i])*m;m=m===7?2:m+1;}
  const x=11-(sum%11),expected=x===11?'0':x===10?'K':String(x);
  return dv===expected;
}
function occurrenceKey(d){return String(Math.floor(d.getTime()/1000));}
function eventDocUrl(){return DB+'/run_events/'+encodeURIComponent(eventId);}
function registrationId(uid,start){return uid+'_'+occurrenceKey(start);}
function registrationUrl(id){return eventDocUrl()+'/web_registrations/'+encodeURIComponent(id);}
function registrationCreateUrl(id){return eventDocUrl()+'/web_registrations?documentId='+encodeURIComponent(id);}
function readAuth(){try{return JSON.parse(localStorage.getItem(AUTH_STORAGE)||'null');}catch(_){return null;}}
function saveAuth(a){localStorage.setItem(AUTH_STORAGE,JSON.stringify(a));return a;}

async function jsonFetch(url,options){
  const r=await fetch(url,options);let data={};try{data=await r.json();}catch(_){}
  if(!r.ok){const e=new Error(data?.error?.message||('HTTP_'+r.status));e.status=r.status;throw e;}
  return data;
}
async function newAnonymousAuth(){
  const data=await jsonFetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key='+API_KEY,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})
  });
  return saveAuth({uid:data.localId,idToken:data.idToken,refreshToken:data.refreshToken,
    expiresAt:Date.now()+(Number(data.expiresIn||3600)-60)*1000});
}
async function refreshAuth(a){
  const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:a.refreshToken});
  const data=await jsonFetch('https://securetoken.googleapis.com/v1/token?key='+API_KEY,{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:body.toString()
  });
  return saveAuth({uid:data.user_id,idToken:data.id_token,refreshToken:data.refresh_token,
    expiresAt:Date.now()+(Number(data.expires_in||3600)-60)*1000});
}
async function ensureAuth(){
  const a=readAuth();
  if(a&&a.idToken&&a.uid&&a.expiresAt>Date.now())return a;
  if(a&&a.refreshToken){try{return await refreshAuth(a);}catch(_){} }
  return newAnonymousAuth();
}
async function getPhoneSdk(){
  if(!phoneSdkPromise){
    phoneSdkPromise=Promise.all([
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js')
    ]).then(async function(modules){
      const appSdk=modules[0],authSdk=modules[1];
      const name='kipzone-qr-phone';
      const existing=appSdk.getApps().find(function(item){return item.name===name;});
      const phoneApp=existing||appSdk.initializeApp({
        apiKey:API_KEY,authDomain:'red-social-1cn89d.firebaseapp.com',
        projectId:PROJECT,messagingSenderId:'989094287116',
        appId:'1:989094287116:web:c093e38442ba31030d9b29'
      },name);
      const auth=authSdk.getAuth(phoneApp);
      await authSdk.setPersistence(auth,authSdk.inMemoryPersistence);
      auth.languageCode='es';
      return {auth:auth,sdk:authSdk};
    }).catch(function(err){phoneSdkPromise=null;throw err;});
  }
  return phoneSdkPromise;
}
async function sendPhoneCode(phone){
  const client=await getPhoneSdk();
  if(!phoneRecaptcha){
    phoneRecaptcha=new client.sdk.RecaptchaVerifier(client.auth,'recaptcha-container',{
      size:'invisible',
      'expired-callback':function(){phoneVerification=null;}
    });
  }
  try{
    const confirmation=await client.sdk.signInWithPhoneNumber(client.auth,phone,phoneRecaptcha);
    phoneVerification={phone:phone,confirmation:confirmation};
    return phoneVerification;
  }catch(err){
    if(phoneRecaptcha){try{phoneRecaptcha.clear();}catch(_){}}
    phoneRecaptcha=null;
    throw err;
  }
}
function phoneError(err){
  const code=String(err&&err.code||err&&err.message||'').toLowerCase();
  if(code.includes('invalid-verification-code'))return 'El código ingresado no es correcto. Revisa los seis números.';
  if(code.includes('code-expired')||code.includes('session-expired'))return 'El código venció. Solicita uno nuevo.';
  if(code.includes('too-many-requests'))return 'Hay demasiados intentos. Espera unos minutos y vuelve a intentarlo.';
  if(code.includes('invalid-phone-number'))return 'Escribe un número de teléfono chileno válido.';
  if(code.includes('quota-exceeded'))return 'El envío de mensajes está temporalmente no disponible.';
  if(code.includes('unauthorized-domain'))return 'Este dominio todavía no está autorizado para verificar teléfonos.';
  if(code.includes('operation-not-allowed'))return 'La verificación telefónica todavía no está habilitada en Firebase.';
  if(code.includes('captcha-check-failed')||code.includes('missing-client-identifier'))return 'No pudimos validar la seguridad del envío. Recarga la página e inténtalo nuevamente.';
  return '';
}
function fieldString(v){return {stringValue:String(v)};}
function fieldBool(v){return {booleanValue:!!v};}
function fieldTime(v){return {timestampValue:v.toISOString()};}

function renderError(message,details){
  app.innerHTML='<div class="state"><strong style="color:var(--text)">'+esc(message)+'</strong>'+
    (details?'<br><br>'+esc(details):'')+'</div>'+
    '<a class="cta ghost" href="'+PLAY+'">Abrir KipZone</a>';
}
function renderEvent(doc){
  const f=doc.fields||{};
  const start=val(f.nextStart)||val(f.startDate)||val(f.startTime);
  eventData={
    title:val(f.title)||'Corrida grupal',image:val(f.imagen)||val(f.photo)||'',
    address:val(f.address)||'',start:start,
    participants:Math.max(0,Number(val(f.participantsCount))||0),
    webRegistrations:Math.max(0,Number(val(f.webRegistrationsCount))||0),
    distance:val(f.distanciaEstimada)||0,enabled:val(f.webRegistrationEnabled)!==false,
    requireRut:val(f.webRegistrationRequireRut)===true,
    checkIn:val(f.webRegistrationCheckInEnabled)===true,
    closed:val(f.webRegistrationClosed)===true
  };
  const e=eventData;
  if(!(e.start instanceof Date)||isNaN(e.start)){
    renderError('Este evento todavía no tiene una fecha válida.');return;
  }
  app.innerHTML=
    '<div class="pill">SOCIAL RUN</div>'+
    (e.image?'<img class="hero" src="'+esc(e.image)+'" alt="Flyer de '+esc(e.title)+'">':'')+
    '<h1>'+esc(e.title)+'</h1>'+
    '<div class="meta">🗓️ <div><b>'+esc(fecha(e.start))+'</b></div></div>'+
    (e.address?'<div class="meta">📍 <div>'+esc(e.address)+'</div></div>':'')+
    '<div class="stats"><div class="stat"><div class="n">'+(e.participants+e.webRegistrations)+'</div>'+
    '<div class="l">INSCRITOS</div><div class="detail">'+e.participants+' app + '+e.webRegistrations+' QR</div></div>'+
    (e.distance>0?'<div class="stat"><div class="n">'+new Intl.NumberFormat('es-CL',{maximumFractionDigits:1}).format(e.distance)+' km</div><div class="l">DISTANCIA</div></div>':'')+
    '</div>'+
    ((!e.enabled||e.closed)?
      '<div class="card"><h2>Inscripciones cerradas</h2><p>El organizador cerró la inscripción web para esta fecha.</p></div>':
      registrationForm(e))+
    '<a class="cta ghost" href="'+PLAY+'" target="_blank" rel="noopener noreferrer">Descargar KipZone en Google Play</a>'+
    '<div class="hint">La app te permite registrar tu recorrido y conquistar territorio para este evento.</div>'+
    '<a class="cta ghost" href="'+esc(location.href)+'">Ya tengo KipZone</a>';
  document.title=e.title+' · KipZone';
  if(e.enabled&&!e.closed) document.getElementById('registration-form').addEventListener('submit',submitRegistration);
}
function registrationForm(e){
  return '<section class="card"><h2>Inscríbete a esta corrida</h2>'+
    '<p>Deja tus datos y confirma tu teléfono con el código que recibirás por SMS.</p>'+
    '<form id="registration-form" novalidate>'+
      '<div class="field"><label for="fullName">Nombre completo</label>'+
      '<input id="fullName" name="fullName" autocomplete="name" maxlength="80" required placeholder="Ej: María González"></div>'+
      '<div class="field"><label for="phone">Teléfono</label>'+
      '<input id="phone" name="phone" inputmode="tel" autocomplete="tel" maxlength="20" required placeholder="Ej: +56 9 1234 5678">'+
      '<small>El organizador podrá usarlo solo para coordinar esta corrida.</small></div>'+
      (e.requireRut?'<div class="field"><label for="rut">RUT</label>'+
      '<input id="rut" name="rut" inputmode="text" maxlength="12" required placeholder="Ej: 12.345.678-5">'+
      '<small>Este evento exige identificación. Tu RUT no aparecerá públicamente.</small></div>':'')+
      '<label class="consent"><input id="consent" type="checkbox" required><span>Acepto que KipZone y el organizador usen estos datos para gestionar mi inscripción y asistencia a este evento. Leí la <a href="'+PRIVACY+'" target="_blank" rel="noopener">política de privacidad</a>.</span></label>'+
      '<div id="sms-step" class="field" hidden><label for="smsCode">Código de seis números</label>'+
      '<input id="smsCode" class="sms-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">'+
      '<small id="sms-hint">Escribe el código recibido por mensaje de texto.</small>'+
      '<button id="resend-code" class="sms-resend" type="button">Reenviar código</button></div>'+
      '<div id="recaptcha-container"></div>'+
      '<div id="form-error" class="error" role="alert"></div>'+
      '<button id="submit" class="cta" type="submit">Recibir código por SMS</button>'+
    '</form></section>';
}
async function submitRegistration(ev){
  ev.preventDefault();
  const errorBox=document.getElementById('form-error'),button=document.getElementById('submit');
  errorBox.textContent='';
  const fullName=document.getElementById('fullName').value.trim().replace(/\s+/g,' ');
  const phone=normalizePhone(document.getElementById('phone').value);
  const rutInput=document.getElementById('rut');const rut=rutInput?normalizeRut(rutInput.value):'';
  if(fullName.length<3){errorBox.textContent='Escribe tu nombre completo.';return;}
  if(!phone){errorBox.textContent='Escribe un teléfono chileno válido.';return;}
  if(eventData.requireRut&&!validRut(rut)){errorBox.textContent='Revisa el RUT ingresado.';return;}
  if(!document.getElementById('consent').checked){errorBox.textContent='Debes aceptar el uso de datos para gestionar esta inscripción.';return;}
  if(!phoneVerification||phoneVerification.phone!==phone){
    button.disabled=true;button.innerHTML='<span class="spinner"></span> Enviando código…';
    try{
      await sendPhoneCode(phone);
      document.getElementById('sms-step').hidden=false;
      document.getElementById('sms-hint').textContent='Enviamos un código de seis números al '+phone+'.';
      document.getElementById('smsCode').value='';
      document.getElementById('smsCode').focus();
      document.getElementById('resend-code').onclick=async function(){
        phoneVerification=null;
        document.getElementById('smsCode').value='';
        await submitRegistration({preventDefault:function(){}});
      };
      button.textContent='Confirmar mi inscripción';
    }catch(err){
      console.error('No fue posible enviar el código SMS:',err);
      errorBox.textContent=phoneError(err)||'No pudimos enviar el código. Revisa tu número e inténtalo nuevamente.';
      button.textContent='Recibir código por SMS';
    }
    button.disabled=false;
    return;
  }
  const code=document.getElementById('smsCode').value.replace(/\D/g,'');
  if(!/^[0-9]{6}$/.test(code)){errorBox.textContent='Escribe los seis números del código recibido.';return;}
  button.disabled=true;button.innerHTML='<span class="spinner"></span> Verificando e inscribiendo…';
  try{
    const verified=await phoneVerification.confirmation.confirm(code);
    const user=verified.user;
    if(normalizePhone(user.phoneNumber)!==phone)throw new Error('PHONE_NUMBER_MISMATCH');
    const idToken=await user.getIdToken();
    const auth=saveAuth({uid:user.uid,idToken:idToken,refreshToken:user.refreshToken,
      expiresAt:Date.now()+55*60*1000,phone:phone,provider:'phone'});
    const id=registrationId(auth.uid,eventData.start);
    const saved=JSON.parse(localStorage.getItem('kz_registration_'+eventId+'_'+occurrenceKey(eventData.start))||'null');
    if(saved&&saved.token){renderSuccess(saved.id,saved.token,fullName);return;}
    // Ya inscrito, pero desde otro dispositivo.
    //
    // El id del documento es determinista (uid + inicio de la ocurrencia) y el
    // uid lo fija el numero de telefono, asi que quien se inscribio en el PC y
    // abre el enlace en el movil apunta al MISMO documento. Sin esta consulta
    // el POST de mas abajo deja de ser un create y Firestore lo evalua como
    // update, que solo permite el organizador: 403, y la pagina lo traducia a
    // "la inscripcion todavia no esta habilitada para este evento", que hacia
    // pensar en un problema de configuracion del evento.
    //
    // No es un caso raro: es lo que pasa siempre que alguien se inscribe en un
    // sitio y quiere su QR en otro, que es justo lo que necesita al llegar a
    // la corrida. localStorage no cubre eso porque vive en un solo navegador.
    //
    // Las reglas permiten leer la inscripcion propia (allow get exige que
    // authUid coincida con el uid del token), asi que el QR se recupera del
    // servidor. Si la lectura falla da igual el motivo -no existe, o el token
    // todavia no vale-: se sigue al create de siempre.
    try{
      const existing=await jsonFetch(registrationUrl(id),{
        headers:{'Authorization':'Bearer '+auth.idToken}
      });
      const existingToken=val(existing.fields&&existing.fields.personalQrToken);
      if(existingToken){
        const existingName=val(existing.fields.fullName)||fullName;
        localStorage.setItem('kz_registration_'+eventId+'_'+occurrenceKey(eventData.start),
          JSON.stringify({id:id,token:existingToken}));
        renderSuccess(id,existingToken,existingName);
        return;
      }
    }catch(_){}
    const token=randomToken();
    const fields={
      fullName:fieldString(fullName),phone:fieldString(phone),rut:fieldString(rut),
      source:fieldString('event_qr_web'),status:fieldString('registered'),
      authUid:fieldString(auth.uid),occurrenceStart:fieldTime(eventData.start),
      registeredAt:{timestampValue:new Date().toISOString()},privacyConsent:fieldBool(true),
      privacyVersion:fieldString('2026-08'),personalQrToken:fieldString(token),
      checkInEnabled:fieldBool(eventData.checkIn)
    };
    await jsonFetch(registrationCreateUrl(id),{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+auth.idToken},
      body:JSON.stringify({fields:fields})
    });
    localStorage.setItem('kz_registration_'+eventId+'_'+occurrenceKey(eventData.start),JSON.stringify({id:id,token:token}));
    renderSuccess(id,token,fullName);
  }catch(err){
    console.error('No fue posible confirmar la inscripción por SMS:',err);
    if(err.status===409)errorBox.textContent='Tu inscripción para esta fecha ya fue registrada.';
    else if(err.status===403)errorBox.textContent='La inscripción todavía no está habilitada para este evento.';
    else errorBox.textContent=phoneError(err)||'No pudimos completar la inscripción. Revisa el código e inténtalo nuevamente.';
    button.disabled=false;button.textContent='Confirmar mi inscripción';
  }
}
function renderSuccess(id,token,name){
  const checkUrl='https://kipzone.run/checkin/?event='+encodeURIComponent(eventId)+'&registration='+encodeURIComponent(id)+'&token='+encodeURIComponent(token);
  app.innerHTML='<section class="card success"><div class="check">✓</div><strong>¡Inscripción confirmada!</strong>'+
    '<p>'+esc(name)+', el organizador ya cuenta contigo para <b>'+esc(eventData.title)+'</b>.</p>'+
    (eventData.checkIn?'<div id="personal-qr" class="personal-qr" aria-label="QR personal de llegada"></div>'+
      '<div class="code">PRESENTA ESTE QR AL LLEGAR</div><p style="margin-top:12px">Guárdalo o toma una captura de pantalla.</p>':'')+
    '</section><a class="cta" href="'+PLAY+'" target="_blank" rel="noopener noreferrer">Descargar KipZone y conquistar territorio</a>'+
    '<div class="hint">Tu inscripción ya está guardada. Descarga la app para registrar tu recorrido y conquistar territorio.</div>';
  if(eventData.checkIn&&window.QRCode){
    new QRCode(document.getElementById('personal-qr'),{text:checkUrl,width:220,height:220,
      colorDark:'#06120C',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});
  }
}
async function loadEvent(){
  if(!eventId){renderError('Este enlace no identifica un evento.');return;}
  try{
    const doc=await jsonFetch(eventDocUrl());renderEvent(doc);
  }catch(err){
    if(err.status===404) renderError('Este evento ya no está disponible.');
    else if(err.status===403) renderError('La inscripción pública todavía no está habilitada para este evento.','El organizador debe publicar las reglas de acceso del evento.');
    else renderError('No pudimos cargar el evento.','Revisa tu conexión e inténtalo nuevamente.');
  }
}
loadEvent();
</script>
