<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0A0E0C">
  <title>Registro de llegada · KipZone</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0A0E0C;color:#F2F5F3;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:grid;place-items:center}
    main{width:min(430px,100%);padding:28px;text-align:center}.brand{font-weight:850;margin-bottom:42px}
    .brand span{color:#35D07F}.icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;

    p{color:#9AA79F;line-height:1.55;margin:0}.box{margin-top:24px;padding:18px;border:1px solid #2A3730;
      border-radius:16px;background:#151C18;font-size:13px;color:#9AA79F}
  </style>
</head>
<body>
  <main>
    <div class="brand">▲ Kip<span>Zone</span></div>
    <div class="icon">✓</div>
    <h1>QR personal de llegada</h1>
    <p>Muéstrale este código al organizador. Solo él puede confirmar tu llegada desde la gestión del evento.</p>
    <div class="box">Este enlace no muestra ni expone los datos personales de la inscripción.</div>
  </main>
